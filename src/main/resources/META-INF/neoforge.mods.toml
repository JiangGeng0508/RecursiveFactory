modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ZinZinc"
description='''
A recursively reusable pocket factory dimension with mirrored item and redstone endpoints.
'''

[[mixins]]
config="recursivefactory.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="electroenergetics"
# Optional: only the power terminal on a factory face needs it. Everything else in the mod runs
# without it, so a pack that does not want electricity simply leaves it out.
type="optional"
versionRange="[1.1.1,)"
ordering="AFTER"
side="BOTH"
