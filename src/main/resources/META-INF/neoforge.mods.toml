modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ZinZinc"
description='''
A recursively reusable pocket factory dimension with mirrored item and redstone endpoints.
'''

# Widens the section radius Immersive Portals uses while drawing the room into a doorway, which its own
# 512-block ceiling otherwise caps at about 31 blocks of viewing distance. See the mixin for the details.
[[mixins]]
config="recursivefactory.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="[6.0.10,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersive_portals_core"
type="required"
versionRange="[${immersive_portals_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cloth_config"
type="required"
versionRange="[${cloth_config_version},)"
ordering="AFTER"
side="BOTH"
