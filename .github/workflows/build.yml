name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The Create runtime libraries live in the git-ignored .reference folder, so the CI
      # workspace does not have them. Fetch the same jars here; if this step fails,
      # build.gradle falls back to the equivalent published Maven artifacts.
      - name: Fetch reference libraries
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/AssestinaR/CreatePocketFactory.git /tmp/create-pocket-factory
          mkdir -p .reference/CreatePocketFactory
          cp -r /tmp/create-pocket-factory/libs .reference/CreatePocketFactory/libs

      # Immersive Portals for NeoForge is not published to any public Maven repository, so the build
      # cannot resolve it and the release jar has to be downloaded. The version comes from
      # gradle.properties so there is a single place to bump it.
      - name: Fetch Immersive Portals
        run: |
          VERSION=$(grep '^immersive_portals_version=' gradle.properties | cut -d= -f2)
          mkdir -p .reference/immersive-portals
          curl -sSL -o ".reference/immersive-portals/immersive_portals-${VERSION}-all.jar" \
            "https://github.com/iPortalTeam/ImmersivePortalsModForNeo/releases/download/v${VERSION}/immersive_portals-${VERSION}-all.jar"
          ls -l .reference/immersive-portals/

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod=+x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace