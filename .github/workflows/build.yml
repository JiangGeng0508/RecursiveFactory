name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - immersive-portals

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Immersive Portals for NeoForge is not published to any public Maven repository, so the build
      # cannot resolve it and the release jar has to be downloaded. The version comes from
      # gradle.properties so there is a single place to bump it.
      - name: Fetch Immersive Portals
        run: |
          VERSION=$(grep '^immersive_portals_version=' gradle.properties | cut -d= -f2)
          mkdir -p .reference/immersive-portals
          curl -fsSL -o ".reference/immersive-portals/immersive_portals-${VERSION}-all.jar" \
            "https://github.com/iPortalTeam/ImmersivePortalsModForNeo/releases/download/v${VERSION}/immersive_portals-${VERSION}-all.jar"
          ls -l .reference/immersive-portals/

      # This is needed to be able to run ./gradlew below
      # You can run `git update-index --chmod=+x gradlew` then remove this step.
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify portal branch behavior
        run: python tools/verification/run_audit.py --timeout 600

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Check distributable
        run: python tools/verification/check_artifact.py
